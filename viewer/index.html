<!doctype html><html lang="zh"><meta charset="utf-8"><title>藤壶 · 打印预览</title><style>body{margin:0;background:#141b1d;color:#eee;font:15px system-ui}canvas{display:block}aside{position:absolute;top:24px;left:28px;max-width:310px}h1{font-size:28px;margin:0 0 12px}p{color:#b5c3c5;line-height:1.7}button,a{color:#eee;background:#334247;border:1px solid #52666b;border-radius:8px;padding:10px 15px;margin:4px;text-decoration:none;cursor:pointer}footer{position:absolute;bottom:24px;left:28px;color:#aebbbc}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script><aside><h1>最高15毫米 / 50 颗</h1><p>20 × 20 厘米范围 · 最高 15 毫米<br>每颗等比例缩小 · 分布于20厘米区域。<br>拖动旋转，滚轮放大。</p><button id="iso">立体</button><button id="top">俯视</button><button id="detail">看细节</button><button id="bed">隐藏底板</button><p id="status">正在载入模型…</p></aside><footer>深色底板只作展示，不包含在打印文件中。</footer><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#141b1d');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,2000);camera.zoom=Math.min(1,innerWidth/innerHeight*.9);camera.updateProjectionMatrix();camera.up.set(0,0,1);camera.position.set(240,-150,220);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(100,100,8);controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x788087,2));for(const[x,y,z,p]of [[0,-100,220,3],[250,150,180,2]]){let l=new THREE.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}
const base=new THREE.Group();scene.add(base);let b=new THREE.Mesh(new THREE.BoxGeometry(204,204,2),new THREE.MeshStandardMaterial({color:0x303b40,roughness:.9}));b.position.set(100,100,-1.1);base.add(b);let grid=new THREE.GridHelper(200,10,0x607078,0x46545a);grid.rotation.x=Math.PI/2;grid.position.set(100,100,-.04);base.add(grid);
new GLTFLoader().load('barnacles.glb?v=size15',g=>{g.scene.rotation.x=Math.PI/2;scene.add(g.scene);document.querySelector('#status').textContent='模型已载入 · 50 颗独立藤壶';window.modelReady=true},undefined,e=>document.querySelector('#status').textContent='载入失败，请通过本地预览地址打开');
document.querySelector('#detail').onclick=()=>{camera.position.set(95,-30,65);controls.target.set(43,43,12);controls.update()};document.querySelector('#top').onclick=()=>{camera.position.set(100,100,370);controls.target.set(100,100,0);controls.update()};document.querySelector('#iso').onclick=()=>{camera.position.set(240,-150,220);controls.target.set(100,100,8);controls.update()};document.querySelector('#bed').onclick=()=>{base.visible=!base.visible;document.querySelector('#bed').textContent=base.visible?'隐藏底板':'显示底板'};
onresize=()=>{const top=innerWidth<850?260:0;const h=Math.max(250,innerHeight-top);renderer.domElement.style.marginTop=top+'px';camera.aspect=innerWidth/h;camera.zoom=Math.min(1,innerWidth/h*.9);camera.updateProjectionMatrix();renderer.setSize(innerWidth,h)};onresize();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></html>
